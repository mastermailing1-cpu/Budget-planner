setup(){return hd('Setup & Backup','Categories, year and your data')+`<div class="row"><label>Budget year <input type="number" style="width:90px" value="${S.year}" onchange="if(Number.isInteger(+this.value)&&+this.value>=1900&&+this.value<=2200){S.year=+this.value;save();render()}else{alert('Enter a valid year from 1900 to 2200.');render()}"></label><button class="g" onclick="exp()">⬇ Export backup</button><label class="g" style="padding:8px 12px;border:1px solid var(--bd);border-radius:10px;cursor:pointer">⬆ Import<input type="file" hidden accept=".json" onchange="imp(this.files[0]);this.value=''"></label><button class="g" onclick="if(confirm('Reload sample data?')){S=fresh();save();render()}">Load sample</button><button class="g" onclick="if(confirm('Clear ALL data?')){S={...fresh(),tx:[],bills:[],debts:[],goals:[],assets:[]};save();render()}">Start blank</button></div>
 <div class="card sc"><table><tr><th>Category<th>Type<th class="r">Default monthly $<th></tr>${S.cats.map((c,i)=>`<tr><td><input value="${esc(c[0])}" onchange="upd('cats',${i},0,this.value)"><td><select onchange="upd('cats',${i},1,this.value)">${['Income','Needs','Wants','Debt','Savings'].map(t=>`<option ${t==c[1]?'selected':''}>${t}</option>`).join('')}</select><td><input class="r" type="number" step="0.01" inputmode="decimal" min="0" value="${c[2]}" onchange="upd('cats',${i},2,this.value,1)"><td><button class="x" onclick="delCat(${i})">✕</button></tr>`).join('')}</table><button class="g" onclick="addCategory()" style="margin-top:10px">+ Add category</button></div>`}};
function exp(){const url=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='budget-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function validImport(x){const arrays=['cats','tx','bills','debts','goals','assets'];if(!x||typeof x!=='object'||arrays.some(k=>!Array.isArray(x[k]))||x.cats.length===0)return false;const num=n=>typeof n==='number'&&Number.isFinite(n)&&n>=0;const names=x.cats.map(c=>Array.isArray(c)?String(c[0]).toLowerCase():'');if(new Set(names).size!==names.length)return false;const hasDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(Date.parse(d));return x.cats.every(c=>Array.isArray(c)&&typeof c[0]==='string'&&c[0].trim()&&['Income','Needs','Wants','Debt','Savings'].includes(c[1])&&num(c[2]))&&x.tx.every(t=>Array.isArray(t)&&hasDate(t[0])&&typeof t[1]==='string'&&x.cats.some(c=>c[0]===t[1])&&num(t[2])&&typeof t[3]==='string')&&x.bills.every(b=>Array.isArray(b)&&typeof b[0]==='string'&&typeof b[1]==='string'&&x.cats.some(c=>c[0]===b[1])&&num(b[2])&&['Monthly','Annual','Quarterly','Weekly','Bi-weekly'].includes(b[3])&&Number.isInteger(Number(b[4]))&&Number(b[4])>=1&&Number(b[4])<=31)&&x.debts.every(d=>Array.isArray(d)&&typeof d[0]==='string'&&num(d[1])&&num(d[2])&&d[2]<=1&&num(d[3]))&&x.goals.every(g=>Array.isArray(g)&&typeof g[0]==='string'&&num(g[1])&&num(g[2])&&num(g[3])&&(g[4]===''||hasDate(g[4])))&&x.assets.every(a=>Array.isArray(a)&&typeof a[0]==='string'&&num(a[1]))}
function imp(f){if(!f)return;const r=new FileReader();r.onerror=()=>alert('Could not read that backup file.');r.onload=()=>{try{const x=JSON.parse(r.result);if(!validImport(x)){alert('This backup has missing or invalid planner data. Your current data has not been changed.');return}const base=fresh();S={...base,...x,paid:x.paid&&typeof x.paid==='object'?x.paid:{},fire:{...base.fire,...(x.fire||{})},year:Number.isInteger(x.year)?x.year:base.year,month:Number.isInteger(x.month)&&x.month>=1&&x.month<=12?x.month:base.month};save();lastSnap=snap();lastStr=JSON.stringify(S);alert('Backup imported successfully.');render()}catch(e){alert('Invalid backup file. Your current data has not been changed.')}};r.readAsText(f)}
render();
</script></body></html>
